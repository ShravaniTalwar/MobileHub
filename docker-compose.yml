version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mobilehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mobilehub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    networks:
      - mobilehub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobilehub-backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DATABASE_URL: jdbc:mysql://mysql-db:3306/mobilehub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    networks:
      - mobilehub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mobilehub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - mobilehub-net

volumes:
  db_data:

networks:
  mobilehub-net:
    driver: bridge
